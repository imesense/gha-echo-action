# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Analyze action"

on:
    pull_request:
        branches:
            - "default"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "test/**"
            - "package*.json"
    push:
        branches:
            - "default"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "test/**"
            - "package*.json"
    schedule:
        - cron: "30 9 * * 1"

permissions:
    actions: read
    checks: write
    contents: read
    security-events: write

jobs:
    analyze-javascript:
        name: "Analyze JavaScript"

        strategy:
            matrix:
                system:
                    - ubuntu-latest
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  config-file: .github/codeql/javascript-config.yml
                  source-root: src

            - name: Run autobuild
              uses: github/codeql-action/autobuild@v4

            - name: Perform analysis
              uses: github/codeql-action/analyze@v4

    analyze-actions:
        name: "Analyze GitHub Actions"

        strategy:
            matrix:
                system:
                    - ubuntu-latest
            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: actions
                  build-mode: none

            - name: Perform analysis
              uses: github/codeql-action/analyze@v4
